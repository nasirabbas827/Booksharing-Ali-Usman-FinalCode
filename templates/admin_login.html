{% extends "base.html" %}
{% block title %}Admin Login - Book Sharing Platform{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-6 col-md-8 col-sm-10">
        <div class="card p-4 border-danger border-2">
            <h2 class="card-title text-center mb-5 display-6" style="color: #dc3545;">
                <i class="bi bi-shield-lock-fill me-2"></i> Admin Access
            </h2>
            <form method="post">
                <div class="mb-4">
                    <label for="username" class="form-label fw-bold">Admin Username</label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter admin username" required>
                </div>
                
                <div class="mb-5">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter admin password" required>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-lg btn-danger">
                        <i class="bi bi-lock-fill me-2"></i> Access Admin Dashboard
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
