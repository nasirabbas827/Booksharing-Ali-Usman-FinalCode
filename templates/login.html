{% extends "base.html" %}
{% block title %}Login - Book Sharing Platform{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-6 col-md-8 col-sm-10">
        <div class="card p-4">
            <h2 class="card-title text-center mb-5 display-6" style="color: var(--primary-color);">
                <i class="bi bi-box-arrow-in-right me-2"></i> Welcome Back
            </h2>
            <form method="post">
                <div class="mb-4">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="mb-5">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                     
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-lg btn-primary">
                        <i class="bi bi-door-open-fill me-2"></i> Log In
                    </button>
                </div>
            </form>
            
            <p class="mt-4 text-center text-muted">
                Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none" style="color: var(--primary-color);">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
